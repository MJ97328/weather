<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 달 날씨</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>한 달 날씨</h1>
  <p class="sub">장소를 검색하면 오늘부터 한 달 뒤까지 매일의 날씨를 보여줍니다.</p>

  <form id="search-form" autocomplete="off">
    <input id="query" type="search" placeholder="도시 또는 장소 (예: 서울, 부산, Tokyo)" required>
    <button type="submit">검색</button>
  </form>

  <ul id="results" class="results" hidden></ul>
  <p id="status" class="status" role="status"></p>

  <section id="forecast" hidden>
    <h2 id="place-name"></h2>
    <p id="source" class="source"></p>
    <div id="summary" class="summary"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>날짜</th><th>날씨</th><th>최고 / 최저</th><th>비</th></tr></thead>
        <tbody id="days"></tbody>
      </table>
    </div>
  </section>

  <footer>
    데이터: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>, 장소 검색 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
    (16일까지: 일반 예보 · 이후: ECMWF 계절 예측 앙상블 평균, 실패 시 과거 10년 평년값).
    2주 이후 예측은 불확실성이 크므로 참고용으로만 사용하세요.
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
