name: Debug forecast (temporary)
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -x
          curl -s -A "weather-debug" "https://nominatim.openstreetmap.org/search?q=%EB%AC%B4%EC%A3%BC&format=jsonv2&limit=3&accept-language=ko" | jq -c '.[] | {name, lat, lon, addresstype}'
          LAT=$(curl -s -A "weather-debug" "https://nominatim.openstreetmap.org/search?q=%EB%AC%B4%EC%A3%BC&format=jsonv2&limit=1" | jq -r '.[0].lat')
          LON=$(curl -s -A "weather-debug" "https://nominatim.openstreetmap.org/search?q=%EB%AC%B4%EC%A3%BC&format=jsonv2&limit=1" | jq -r '.[0].lon')
          Q="latitude=$LAT&longitude=$LON&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&forecast_days=8&timezone=auto"
          for M in "" "&models=kma_seamless" "&models=kma_ldps" "&models=kma_gdps" "&models=ecmwf_ifs025" "&models=gfs_seamless" "&models=jma_seamless"; do
            echo "=== model: ${M:-best_match}"
            curl -s "https://api.open-meteo.com/v1/forecast?$Q$M" | jq -c '.error, .reason, .elevation, (.daily | [.time, .weather_code, .temperature_2m_min, .temperature_2m_max, .precipitation_sum, .precipitation_probability_max] | transpose[] )'
          done
