name: Debug geocoding (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for Q in 부산 서울 무주 제주 도쿄 강남; do
            E=$(jq -rn --arg q "$Q" '$q|@uri')
            echo "=== $Q open-meteo"
            curl -s "https://geocoding-api.open-meteo.com/v1/search?name=$E&count=8&language=ko&format=json" | jq -c '.results[]? | {name, admin1, country, feature_code, population, lat: .latitude, lon: .longitude}'
            echo "=== $Q nominatim"
            curl -s -A "weather-debug (github.com/MJ97328/weather)" "https://nominatim.openstreetmap.org/search?q=$E&format=jsonv2&addressdetails=1&limit=8&accept-language=ko" | jq -c '.[] | {name, category, type, addresstype, place_rank, importance, state: .address.state, city: .address.city, country: .address.country, lat, lon}'
            sleep 1
          done
