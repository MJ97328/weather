name: Debug forecast (temporary)
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://api.open-meteo.com/v1/forecast?latitude=36.0121&longitude=127.6692&timezone=auto&forecast_days=3"
          for M in kma_seamless kma_ldps kma_gdps; do
            echo "=== $M hourly"
            curl -s "$B&models=$M&hourly=temperature_2m,precipitation,weather_code" | jq -c '.reason, (.hourly | [.time, .temperature_2m, .precipitation, .weather_code] | transpose | map(select(.[1] != null)) | length), (.hourly | [.time, .temperature_2m, .precipitation, .weather_code] | transpose | map(select(.[1] != null)) | .[0:3])'
          done
          echo "=== Seoul kma_seamless daily"
          curl -s "https://api.open-meteo.com/v1/forecast?latitude=37.57&longitude=126.98&timezone=auto&forecast_days=3&models=kma_seamless&daily=temperature_2m_max,temperature_2m_min" | jq -c '.daily'
