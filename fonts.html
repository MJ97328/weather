<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글씨체 비교</title>
<!-- 비교용 글씨체 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/css/SpoqaHanSansNeo.css">
<style>
  @font-face { font-family: "GmarketSans"; font-weight: 300; src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "GmarketSans"; font-weight: 500; src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "GmarketSans"; font-weight: 700; src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff") format("woff"); font-display: swap; }
</style>
<link rel="stylesheet" href="style.css">
<style>
  .intro { margin-bottom: 32px; }
  .intro a { color: var(--ink); }
  .sample {
    font-family: var(--body);
    padding: 32px 0 40px; border-top: 1px solid var(--hairline);
  }
  .sample .tag {
    display: inline-block; font-family: var(--font); font-size: 12px; font-weight: 600;
    padding: 4px 12px; border-radius: var(--r-full); background: var(--canvas-soft); margin-bottom: 16px;
  }
  .sample .tag.rec { background: var(--primary); color: var(--on-primary); }
  .sample .why { font-family: var(--font); color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .sample h1, .sample h2, .sample .now .temp, .sample .now .desc, .sample .value { font-family: var(--head); }
  .sample h1 { font-size: 48px; margin-bottom: 8px; }
  .sample h2 { margin-top: 24px; font-size: 28px; }
  .sample .now { margin-top: 16px; }
  .sample .cal-grid { margin-top: 8px; }
  .sample .cell { cursor: default; }
  .sample .body { font-size: 16px; margin: 16px 0 0; }
</style>
</head>
<body>
<main>
  <header class="hero intro">
    <h1>글씨체 비교.</h1>
    <p class="sub">같은 화면을 글씨체만 바꿔서 보여줘요. 마음에 드는 번호를 알려 주세요.</p>
    <p class="source"><a href="./">← 날씨 사이트로 돌아가기</a></p>
  </header>
  <div id="samples"></div>
</main>

<template id="tpl">
  <section class="sample">
    <span class="tag"></span>
    <p class="why"></p>
    <h1>Weather.</h1>
    <p class="sub">장소를 검색하면 오늘 날씨와 한 달 뒤까지의 날씨를 보여줍니다.</p>
    <h2>서울특별시, 대한민국</h2>
    <p class="source">9월 30일 ~ 10월 30일</p>
    <div class="now">
      <div class="big-icon">⛅</div>
      <div>
        <div class="temp">22°</div>
        <div class="desc">구름 조금</div>
        <div class="meta">체감 21° · <span class="hi">최고 24°</span> / <span class="lo">최저 14°</span></div>
      </div>
    </div>
    <div class="stats">
      <div><span class="label">비 올 확률</span><span class="value">10%</span></div>
      <div><span class="label">습도</span><span class="value">55%</span></div>
      <div><span class="label">바람</span><span class="value">3.2m/s</span></div>
    </div>
    <div class="cal-grid">
      <div class="cell today"><span class="d">30</span><span class="i">⛅</span><span class="tt"><span class="hi">24</span>/<span class="lo">14</span></span></div>
      <div class="cell"><span class="d">1</span><span class="i">☀️</span><span class="tt"><span class="hi">18</span>/<span class="lo">12</span></span></div>
      <div class="cell"><span class="d">2</span><span class="i">☀️</span><span class="tt"><span class="hi">18</span>/<span class="lo">10</span></span></div>
      <div class="cell"><span class="d">3</span><span class="i">☁️</span><span class="tt"><span class="hi">19</span>/<span class="lo">9</span></span></div>
      <div class="cell"><span class="d">4</span><span class="i">⛅</span><span class="tt"><span class="hi">24</span>/<span class="lo">10</span></span></div>
      <div class="cell"><span class="d">5</span><span class="i">🌦️</span><span class="tt"><span class="hi">22</span>/<span class="lo">14</span></span></div>
      <div class="cell"><span class="d">6</span><span class="i">☁️</span><span class="tt"><span class="hi">19</span>/<span class="lo">12</span></span></div>
    </div>
    <p class="body">2주 이후는 ECMWF 계절 예측 여러 개의 평균이에요. 날씨 경향만 참고하세요. 0123456789°</p>
  </section>
</template>

<script>
  const FONTS = [
    { tag: "0. 지금 (Inter + Pretendard)", why: "현재 사이트에 쓰는 글씨체예요.",
      head: '"Inter", "Pretendard Variable", sans-serif', body: '"Inter", "Pretendard Variable", sans-serif' },
    { tag: "1. SUIT", rec: true, why: "반듯한 기하학 모양. 지금 디자인과 잘 맞고 조금 더 세련되고 가벼워요.",
      head: '"SUIT Variable", sans-serif', body: '"SUIT Variable", sans-serif' },
    { tag: "2. Gmarket Sans + SUIT", why: "제목과 숫자는 두껍고 동글한 G마켓 산스, 본문은 SUIT.",
      head: '"GmarketSans", sans-serif', body: '"SUIT Variable", sans-serif' },
    { tag: "3. Spoqa Han Sans Neo", why: "차분하고 읽기 편해요. 숫자가 깔끔한 앱 같은 느낌.",
      head: '"Spoqa Han Sans Neo", sans-serif', body: '"Spoqa Han Sans Neo", sans-serif' },
    { tag: "4. IBM Plex Sans KR", why: "살짝 기계적이고 개성 있는 느낌. 숫자가 특히 멋있어요.",
      head: '"IBM Plex Sans KR", sans-serif', body: '"IBM Plex Sans KR", sans-serif' },
  ];
  const tpl = document.getElementById("tpl");
  const out = document.getElementById("samples");
  for (const f of FONTS) {
    const node = tpl.content.firstElementChild.cloneNode(true);
    node.style.setProperty("--head", f.head);
    node.style.setProperty("--body", f.body);
    const tag = node.querySelector(".tag");
    tag.textContent = f.tag + (f.rec ? " · 추천" : "");
    tag.classList.toggle("rec", !!f.rec);
    node.querySelector(".why").textContent = f.why;
    out.appendChild(node);
  }
</script>
</body>
</html>
